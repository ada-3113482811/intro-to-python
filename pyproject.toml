[project]
name = "introduction-to-python"
version = "0.1.0"
description = "Introduction to Python asynchronous course at Imperial College London"
readme = "README.md"
requires-python = ">=3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pendulum>=3.2.0",
    "pytest>=9.1.1",
]

[dependency-groups]
dev = ["ipykernel>=7.3.0", "jupyter>=1.1.1", "nbval>=0.11.0"]

[tool.ruff]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
ignore = [
    "F811",
    "E402",
    "I",
    "UP031",
    "SIM201",
    "PIE790",
    "PLR0133",
    "SIM223",
    "SIM222",
    "RET501",
    "PLR1711",
]
